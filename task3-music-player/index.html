<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <title>Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="music-player">
        <!-- Music box -->
        <div class="music-box">
            <div class="cover-img">
                <img src="assets/images/sahil-boyu.jpg" alt="Album Cover">
            </div>
            <div class="title">
                <h3>Sahil boyu gəzirəm</h3>
                <p>Qaya qrupu</p>
            </div>
            <div class="progress-bar">
                <span class="current-time">0:00</span>
                <input type="range" aria-label="Progress Bar" class="progress" value="0" min="0" max="100">
                <span class="duration">2:21</span>
            </div>
            <!-- Song Controls -->
            <div class="main-controls">
                <button id="prev" class="btn fa-xl" aria-label="Previous Song"><i
                        class="fa-solid fa-backward"></i></button>
                <button id="play" class="btn play-btn fa-xl" aria-label="Play/Pause"><i
                        class="fa-solid fa-play"></i></button>
                <button id="next" class="btn fa-xl" aria-label="Next Song"><i class="fa-solid fa-forward"></i></button>
            </div>

            <div class="volume-container">
                <button id="volume-btn" class="volume-btn " aria-label="Mute/Unmute"><i
                        class="fa-solid fa-volume-up"></i></button>
                <div id="volume-panel" class="volume-panel hidden">
                    <input type="range" aria-label="Volume Slider" id="volume-slider" min="0" max="100" step="1"
                        value="100">
                    <span id="volume-percent">100%</span>
                </div>
            </div>
             <!-- Playlist -->
            <div class="playlist">
                <audio id="audio"></audio>
                <div class="playlist-container">
                    <div class="playlist-items">
                        <span class="song-title"></span>
                        <span class="song-artist"></span>
                    </div>
                    <button class="playlist-arrow" aria-label="Toggle Playlist"><i
                            class="fa-solid fa-angle-down "></i></button>
                </div>
                <ul class="playlist-dropdown hidden"></ul>
            </div>
        </div>
        <script src="index.js"></script>
</body>

</html>
