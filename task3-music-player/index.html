<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <title>Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="music-player">
        <div class="music-box">
            <div class="cover-img">
                <img src="assets/images/sahil-boyu.jpg" alt="Album Cover">
            </div>
            <div class="title">
                <h3>Sahil boyu gəzirəm</h3>
                <p>Qaya qrupu</p>
            </div>
            <div class="progress-bar">
                <span class="current-time">0:00</span>
                <input type="range" aria-label="Progress Bar" class="progress" value="0" min="0" max="100">
                <span class="duration">2:21</span>
            </div>
            <div class="control">
                <div class="main-controls">
                    <button id="prev" class="btn" aria-label="Previous Song"><i
                            class="fa-solid fa-backward"></i></button>
                    <button id="play" class="btn play-btn" aria-label="Play/Pause"><i
                            class="fa-solid fa-play"></i></button>
                    <button id="next" class="btn" aria-label="Next Song"><i class="fa-solid fa-forward"></i></button>
                </div>
            </div>
            <div class="playlist">
                <audio id="audio"></audio>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
