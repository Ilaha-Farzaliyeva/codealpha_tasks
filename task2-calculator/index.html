<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="icon"
        href="https://img.magnific.com/free-vector/calculator-floating-cartoon-vector-icon-illustration-finance-business-icon-concept-isolated-flat_138676-9297.jpg?semt=ais_test_b&w=740&q=80">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calculator">
        <div id="display" class="calculator-display">0</div>
        <div class="calculator-keys">
            <button class="btn function" data-action="clear">C</button>
            <button class="btn function" data-action="delete">DEL</button>
            <button class="btn operator" data-action="percent">%</button>
            <button class="btn operator" data-action="operator">/</button>

            <button class="btn" data-action="number">7</button>
            <button class="btn" data-action="number">8</button>
            <button class="btn" data-action="number">9</button>
            <button class="btn operator" data-action="operator">*</button>

            <button class="btn" data-action="number">4</button>
            <button class="btn" data-action="number">5</button>
            <button class="btn" data-action="number">6</button>
            <button class="btn operator" data-action="operator">-</button>

            <button class="btn" data-action="number">1</button>
            <button class="btn" data-action="number">2</button>
            <button class="btn" data-action="number">3</button>
            <button class="btn operator" data-action="operator">+</button>

            <button class="btn zero" data-action="number">0</button>
            <button class="btn " data-action="decimal">.</button>
            <button class="btn calculate" data-action="calculate">=</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
